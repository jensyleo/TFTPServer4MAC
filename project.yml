name: TFTPServer
options:
  bundleIdPrefix: com.jensyleo
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TFTPServer:
    type: application
    platform: macOS
    sources:
      - path: TFTPServer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jensyleo.tftpserver
        PRODUCT_NAME: TFTPServer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ENABLE_HARDENED_RUNTIME: YES
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    info:
      path: TFTPServer/Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.utilities
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
  TFTPServerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TFTPServerTests
    dependencies:
      - target: TFTPServer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jensyleo.tftpserver.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TFTPServer:
    build:
      targets:
        TFTPServer: all
    test:
      targets:
        - TFTPServerTests
    run:
      config: Debug
